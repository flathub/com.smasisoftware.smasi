app-id: com.smasisoftware.smasi
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: smasi
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
modules:
  - name: smasi
    buildsystem: simple
    build-commands:
      - mkdir -p /app/smasi
      - cp -r smasi lib data /app/smasi/
      - chmod +x /app/smasi/smasi
      - mkdir -p /app/bin
      - ln -s /app/smasi/smasi /app/bin/smasi
      - install -Dm644 com.smasisoftware.smasi.desktop /app/share/applications/com.smasisoftware.smasi.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.smasisoftware.smasi.png
      - install -Dm644 com.smasisoftware.smasi.metainfo.xml /app/share/metainfo/com.smasisoftware.smasi.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/2S-Software/smasi-download/releases/download/v8.5.2/smasi-8.5.2-linux-x64.tar.gz
        sha256: 8ca68710f84b375da384850ce8dc832da48a83a9b99250f780e70b73e7ab147f
        only-arches:
          - x86_64
      - type: file
        url: https://raw.githubusercontent.com/2S-Software/smasi-download/e999f6ed37fa1c360addd89513d70c32291f87f1/linux/package/com.smasisoftware.smasi.desktop
        sha256: eacf1211aa5cb11ec4a8e8b5d01d8e00f0c1701ec69b1fc0a52c26725e229878
      - type: file
        url: https://raw.githubusercontent.com/2S-Software/smasi-download/e999f6ed37fa1c360addd89513d70c32291f87f1/linux/package/com.smasisoftware.smasi.metainfo.xml
        sha256: a0705041d8ce2ea1c14ee0d659043d8e1af7948ba24c82f14c3ec3657141aba8
      - type: file
        path: icon.png
