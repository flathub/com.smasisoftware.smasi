app-id: com.smasisoftware.smasi
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: smasi
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
modules:
  - name: smasi
    buildsystem: simple
    build-commands:
      - mkdir -p /app/smasi
      - cp -r smasi lib data /app/smasi/
      - chmod +x /app/smasi/smasi
      - mkdir -p /app/bin
      - ln -s /app/smasi/smasi /app/bin/smasi
      - install -Dm644 com.smasisoftware.smasi.desktop /app/share/applications/com.smasisoftware.smasi.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.smasisoftware.smasi.png
      - install -Dm644 com.smasisoftware.smasi.metainfo.xml /app/share/metainfo/com.smasisoftware.smasi.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/2S-Software/smasi-download/releases/download/v8.5.1/smasi-8.5.1-linux-x64.tar.gz
        sha256: 9da0327c00c3238e9ebc39ec35682e8a4b8912123ac47786630aaf01b8ccf2a7
        only-arches:
          - x86_64
      - type: file
        url: https://raw.githubusercontent.com/2S-Software/smasi-download/7d5c3b7e50e284e4d3f27831dc42ee9413ae8a44/linux/package/com.smasisoftware.smasi.desktop
        sha256: eacf1211aa5cb11ec4a8e8b5d01d8e00f0c1701ec69b1fc0a52c26725e229878
      - type: file
        url: https://raw.githubusercontent.com/2S-Software/smasi-download/7d5c3b7e50e284e4d3f27831dc42ee9413ae8a44/linux/package/com.smasisoftware.smasi.metainfo.xml
        sha256: 67d5fee575644d96913cbb1a8f312ee4b94949fcbf25d30683c3f53b8d30cbd1
